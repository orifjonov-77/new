services:
  - type: worker
    name: mdev-certificate-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: RESULT_DELAY_MINUTES
        value: 15
      - key: MDEV_URL
        value: https://mdev.uz
